<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <!-- 저장된 테마를 그리기 전에 적용해 흰 화면이 번쩍이지 않게 함 (src/utils/theme.js와 같은 키) -->
  <script>try{var t=localStorage.getItem('cast-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
  <title>C.A.S.T — 신뢰형 리서치 에이전트</title>
  <!-- 글꼴: Pretendard (SF Pro 느낌의 한글 글꼴). Mac에서는 시스템 글꼴로 대체될 수 있습니다 -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <!-- Extra explicit stylesheet reference for easier debugging in Vite -->
  <link rel="stylesheet" href="/src/styles/global.css" />
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
